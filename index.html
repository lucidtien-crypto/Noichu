<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soạn Thảo Bằng Giọng Nói</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #F9F7F1; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 1.2rem 1rem; 
            color: #2C3539; 
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .container { 
            max-width: 850px; 
            width: 100%; 
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        
        h1 {
            text-align: center; 
            font-size: 1.8rem; 
            margin-top: 0;
            margin-bottom: 0.3rem;
            color: #2C3539;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 0.8rem;
            min-height: 2.2rem;
        }

        /* Đèn báo trạng thái Xanh Ngọc Bích */
        .status-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #B0BEC5;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: #00A86B; /* Xanh Ngọc Bích */
            box-shadow: 0 0 12px #00A86B;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 168, 107, 0.7); }
            70% { transform: scale(1.15); box-shadow: 0 0 0 10px rgba(0, 168, 107, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 168, 107, 0); }
        }

        .status-text { 
            font-size: 1.1rem; 
            color: #666; 
            font-style: italic; 
        }

        /* Khung chữ với hiệu ứng viền Xanh Ngọc Bích */
        .text-box { 
            width: 100%; 
            flex-grow: 1;
            min-height: 240px;
            font-size: 28px; 
            line-height: 1.6; 
            padding: 1.2rem; 
            border-radius: 12px; 
            border: 2px solid #DCD7C9; 
            background-color: #FFFFFF; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            resize: none; 
            color: #1A1A1A; 
            box-sizing: border-box;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        
        .text-box:focus { outline: none; border-color: #A3C1AD; }
        
        .recording-jade { 
            border-color: #00A86B !important; 
            box-shadow: 0 0 18px rgba(0, 168, 107, 0.35) !important; 
        }
        
        /* Bố cục nút bấm */
        .controls-edit {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .controls-main { 
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-top: 10px; 
        }
        
        button { 
            font-size: 1.2rem; 
            padding: 15px 10px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px; 
            transition: all 0.2s ease; 
            font-weight: 600; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        
        button:active { transform: translateY(2px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .btn-start { background-color: #00A86B; color: white; grid-column: 1 / -1; font-size: 1.4rem; padding: 18px 15px;} 
        .btn-stop { background-color: #E57373; color: white; }
        .btn-copy { background-color: #64B5F6; color: white; }
        .btn-save { background-color: #FFB74D; color: #333; }
        .btn-open { background-color: #BA68C8; color: white; }

        .btn-delete-word { background-color: #ECEFF1; color: #37474F; border: 1px solid #CFD8DC; }
        .btn-delete-chunk { background-color: #CFD8DC; color: #263238; }
        .btn-clear-all { background-color: #D32F2F; color: white; } 
        .btn-undo { background-color: #78909C; color: white; }

        @media (max-width: 600px) {
            h1 { font-size: 1.4rem; }
            .text-box { font-size: 24px; padding: 0.8rem; }
            .controls-main, .controls-edit { grid-template-columns: 1fr; gap: 8px; }
            .btn-start { grid-column: auto; } 
            button { padding: 14px 10px; font-size: 1.15rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Soạn Thảo Bằng Giọng Nói</h1>
        
        <div class="status-container">
            <div id="statusDot" class="status-dot"></div>
            <div id="statusText" class="status-text">Sẵn sàng. Hãy bấm "Bắt đầu nói".</div>
        </div>

        <textarea id="resultText" class="text-box" placeholder="Chữ sẽ hiện ra ngay khi bạn nói..."></textarea>
        
        <!-- Nhóm nút xóa -->
        <div class="controls-edit">
            <button id="btnDeleteWord" class="btn-delete-word"><i class="fas fa-backspace"></i> Xóa 1 từ</button>
            <button id="btnDeleteChunk" class="btn-delete-chunk"><i class="fas fa-outdent"></i> Xóa đoạn vừa nói</button>
            <button id="btnClearAll" class="btn-clear-all"><i class="fas fa-times-circle"></i> Xóa tất cả (X)</button>
        </div>

        <!-- Nhóm nút chức năng -->
        <div class="controls-main">
            <button id="btnStart" class="btn-start"><i class="fas fa-microphone"></i> Bắt đầu nói</button>
            <button id="btnStop" class="btn-stop" disabled><i class="fas fa-stop-circle"></i> Ngừng lại</button>
            <button id="btnCopy" class="btn-copy"><i class="fas fa-copy"></i> Copy chữ</button>
            <button id="btnSave" class="btn-save"><i class="fas fa-file-download"></i> Tải bản thảo về</button>
            <button id="btnOpen" class="btn-open"><i class="fas fa-folder-open"></i> Mở bản thảo đã lưu</button>
            <button id="btnUndo" class="btn-undo" style="display: none; grid-column: 1 / -1;"><i class="fas fa-undo"></i> Khôi phục lại chữ vừa xóa</button>
        </div>

        <input type="file" id="fileInput" accept=".txt" style="display: none;">
    </div>

    <script>
        const resultText = document.getElementById('resultText');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnCopy = document.getElementById('btnCopy');
        const btnSave = document.getElementById('btnSave');
        const btnOpen = document.getElementById('btnOpen');
        const fileInput = document.getElementById('fileInput');
        const btnDeleteWord = document.getElementById('btnDeleteWord');
        const btnDeleteChunk = document.getElementById('btnDeleteChunk');
        const btnClearAll = document.getElementById('btnClearAll');
        const btnUndo = document.getElementById('btnUndo');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        let isManuallyStopped = true;
        let sessionBaseText = ''; // Gốc văn bản cố định trước mỗi phiên thu âm
        let phraseHistory = [];  // Lịch sử lưu vết để phục vụ nút "Xóa đoạn vừa nói"
        let undoHistory = ''; 

        function notify(message, color) {
            statusText.innerHTML = message;
            statusText.style.color = color || "#666";
        }

        // Tự động khôi phục bài làm dở khi mở lại trang
        window.addEventListener('DOMContentLoaded', () => {
            const savedDraft = localStorage.getItem('voiceDraftForElderly');
            if (savedDraft && savedDraft.trim() !== '') {
                resultText.value = savedDraft.trim();
                sessionBaseText = savedDraft.trim();
                notify("Đã tự động mở lại bài viết bạn đang làm dở.", "#00A86B");
            }
        });

        function saveStateForUndo() {
            undoHistory = resultText.value;
            btnUndo.style.display = 'flex';
        }

        // Ngắt sạch đệm micro khi thực hiện các thao tác xóa
        function resetMicrophoneIfListening() {
            if (!isManuallyStopped && recognition) {
                try {
                    recognition.abort();
                } catch(e) { console.log(e); }
            }
        }

        // Đồng bộ khi người dùng gõ/sửa bằng tay
        resultText.addEventListener('input', () => {
            sessionBaseText = resultText.value;
            localStorage.setItem('voiceDraftForElderly', resultText.value);
            resetMicrophoneIfListening();
        });

        // Cấu hình AI Nhận diện giọng nói chống lặp chữ 100%
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true; 
            recognition.lang = 'vi-VN';

            recognition.onstart = function() {
                notify("Đang thu âm... <br><span style='font-size: 0.95rem;'>(Cứ nói từ từ, dừng lại ngẫm nghĩ máy vẫn đợi)</span>", "#00A86B");
                statusDot.classList.add('active');
                resultText.classList.add('recording-jade');
                
                // Khóa gốc văn bản hiện tại trước khi bắt đầu nối câu mới
                sessionBaseText = resultText.value;
                btnStart.disabled = true;
                btnStop.disabled = false;
            };

            recognition.onresult = function(event) {
                let sessionFinals = '';
                let sessionInterim = '';

                // Quét lại toàn bộ danh sách kết quả của phiên hiện tại từ 0 -> length
                for (let i = 0; i < event.results.length; ++i) {
                    let transcript = event.results[i][0].transcript.trim();
                    if (transcript === '') continue;

                    if (event.results[i].isFinal) {
                        // Viết hoa chữ đầu câu
                        transcript = transcript.charAt(0).toUpperCase() + transcript.slice(1);
                        if (sessionFinals !== '') sessionFinals += ' ';
                        sessionFinals += transcript;
                    } else {
                        if (sessionInterim !== '') sessionInterim += ' ';
                        sessionInterim += transcript;
                    }
                }

                // Tái dựng lại văn bản: [Gốc cũ] + [Các câu đã chốt trong phiên] + [Chữ đang nói dở]
                let fullText = sessionBaseText;

                if (sessionFinals !== '') {
                    if (fullText !== '' && !fullText.endsWith(' ') && !fullText.endsWith('\n')) {
                        fullText += ' ';
                    }
                    fullText += sessionFinals;
                }

                if (sessionInterim !== '') {
                    if (fullText !== '' && !fullText.endsWith(' ') && !fullText.endsWith('\n')) {
                        fullText += ' ';
                    }
                    fullText += sessionInterim;
                }

                resultText.value = fullText;
                resultText.scrollTop = resultText.scrollHeight;
                localStorage.setItem('voiceDraftForElderly', fullText);
            };

            recognition.onend = function() {
                // Cập nhật gốc văn bản mới nhất sau khi ngắt session
                sessionBaseText = resultText.value;

                if (!isManuallyStopped) {
                    // Lưu snapshot hỗ trợ nút Xóa đoạn
                    if (sessionBaseText.trim() !== '') {
                        phraseHistory.push(sessionBaseText);
                    }
                    try { recognition.start(); } catch (e) {}
                } else {
                    notify("Đã ngừng. Bạn có thể sửa hoặc bấm Copy.", "#666");
                    statusDot.classList.remove('active');
                    resultText.classList.remove('recording-jade');
                    btnStart.disabled = false;
                    btnStop.disabled = true;
                }
            };

            recognition.onerror = function(event) {
                if (event.error === 'not-allowed') {
                    notify("Lỗi: Chưa cấp quyền sử dụng Micro.", "red");
                    isManuallyStopped = true;
                    statusDot.classList.remove('active');
                    resultText.classList.remove('recording-jade');
                    btnStart.disabled = false;
                    btnStop.disabled = true;
                }
            };
        } else {
            notify("Trình duyệt này không hỗ trợ nhận diện giọng nói.", "red");
            btnStart.disabled = true;
        }

        // --- CÁC NÚT XÓA THÔNG MINH ---

        // 1. Xóa tất cả
        btnClearAll.addEventListener('click', () => {
            if (resultText.value.trim() !== '') {
                saveStateForUndo();
                resultText.value = '';
                sessionBaseText = '';
                phraseHistory = [];
                localStorage.removeItem('voiceDraftForElderly');
                resetMicrophoneIfListening();
                notify("Đã xóa sạch chữ. (Bấm 'Khôi phục' ở dưới nếu bấm nhầm)", "#D32F2F");
            }
        });

        // 2. Xóa 1 từ
        btnDeleteWord.addEventListener('click', () => {
            let text = resultText.value.trimEnd();
            if (text.length > 0) {
                saveStateForUndo();
                let lastSpaceIndex = text.lastIndexOf(' ');
                let newText = (lastSpaceIndex !== -1) ? text.substring(0, lastSpaceIndex) : '';
                resultText.value = newText;
                sessionBaseText = newText;
                localStorage.setItem('voiceDraftForElderly', newText);
                resetMicrophoneIfListening();
                notify("Đã xóa 1 từ vừa rồi.", "#37474F");
            }
        });

        // 3. Xóa đoạn vừa nói
        btnDeleteChunk.addEventListener('click', () => {
            saveStateForUndo();
            if (phraseHistory.length > 0) {
                let prevText = phraseHistory.pop();
                resultText.value = prevText;
                sessionBaseText = prevText;
            } else if (resultText.value.trim() !== '') {
                let words = resultText.value.trim().split(/\s+/);
                words.splice(-5); // Xóa 5 từ gần nhất nếu không có lịch sử
                let newText = words.join(' ');
                resultText.value = newText;
                sessionBaseText = newText;
            }
            localStorage.setItem('voiceDraftForElderly', resultText.value);
            resetMicrophoneIfListening();
            notify("Đã xóa đoạn vừa nói.", "#263238");
        });

        // 4. Khôi phục lại
        btnUndo.addEventListener('click', () => {
            resultText.value = undoHistory;
            sessionBaseText = undoHistory;
            localStorage.setItem('voiceDraftForElderly', undoHistory);
            btnUndo.style.display = 'none';
            resetMicrophoneIfListening();
            notify("Đã khôi phục lại chữ thành công!", "#00A86B");
        });

        // --- TẢI & MỞ BẢN THẢO VỚI NGÀY GIỜ PHÚT ---

        btnSave.addEventListener('click', () => {
            const text = resultText.value;
            if (!text.trim()) {
                notify("Chưa có chữ nào để tải về!", "#E57373");
                return;
            }
            
            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}h${String(now.getMinutes()).padStart(2, '0')}`;
            const fileName = `Ban_Thao_${dateStr}_${timeStr}.txt`;

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
            
            notify(`Đã tải về bản thảo: <b>${fileName}</b>`, "#FF9800");
        });

        btnOpen.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    resultText.value = evt.target.result.trim();
                    sessionBaseText = evt.target.result.trim();
                    phraseHistory = [sessionBaseText];
                    localStorage.setItem('voiceDraftForElderly', sessionBaseText);
                    notify("Đã mở nội dung bản thảo lên thành công!", "#BA68C8");
                };
                reader.readAsText(file, 'UTF-8');
            }
        });

        // Điều khiển chính
        btnStart.addEventListener('click', () => {
            isManuallyStopped = false;
            sessionBaseText = resultText.value;
            recognition.start();
        });

        btnStop.addEventListener('click', () => {
            isManuallyStopped = true;
            recognition.stop();
        });

        btnCopy.addEventListener('click', () => {
            resultText.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges(); 
            notify("Đã copy chữ thành công!", "#2196F3");
        });
    </script>
</body>
</html>
