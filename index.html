<style>

/* Một màn hình trên điện thoại: không cần cuộn giao diện; chỉ vùng chữ cuộn. */

.panel-heading strong{display:flex;align-items:center;gap:7px}.live-dot{display:inline-block;width:8px;height:8px;border-radius:100%;background:#a69c8e;flex-shrink:0}.live-dot.on{background:#1b6b4d;animation:pulse 1.5s infinite}.save-text{border:1px solid var(--line);border-radius:7px;background:#f4efe5;color:var(--ink);font-size:12px;padding:5px 8px;font-weight:700;white-space:nowrap}.save-text:active{transform:scale(.98)}.panel-foot{gap:7px}.level{flex-shrink:0;width:62px}@media(max-width:365px){.panel-foot{font-size:11px}.save-text{font-size:11px;padding:5px 6px}.level{width:36px}}

/* Giao diện ghi âm gọn trong một màn hình, khu vực phát nằm dưới cùng */
.app{gap:clamp(4px,.75dvh,8px)}

@media(max-height:600px){header p{display:none}.mode small{display:none}.mode button{min-height:36px}.audio-head strong{font-size:11px}.audio .download,.audio-delete{min-height:26px;padding:3px 6px}}
.audio-message{margin:2px 0;color:var(--red);font-size:12px;line-height:1.35}.audio[hidden]{display:none}
/* Trình phát âm thanh luôn hiện ở cuối màn hình: một hàng duy nhất. */
.audio,.audio.show{display:block!important;flex:0 0 auto;background:#fffdfa;border:1.5px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 2px 8px #382b1710;min-width:0}
.audio-bar{display:flex;align-items:center;gap:clamp(5px,1vw,12px);width:100%;min-width:0;min-height:39px}
.audio-title{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-size:clamp(13px,2.8vw,16px);white-space:nowrap;flex:none}

.audio-play{display:grid;place-items:center;flex:none;width:32px;height:32px;border:2px solid var(--green);border-radius:50%;color:var(--green);background:#fff;font-size:14px;font-weight:800;padding:0}

<body>
<main class="app">
<header><div><h1>Sổ tay giọng nói</h1><p>Nói theo cú pháp : Chấm . - Phẩy , - Xuống Dòng ↵ để tự động thêm dấu câu.</p></div><div class="header-status" id="statusBanner" aria-live="polite"><div class="header-status-line"><span class="led"></span><strong id="statusTitle">Sẵn sàng</strong><span class="timer" id="timer">00:00</span></div><small id="statusSub">Bấm BẮT ĐẦU để lấy chữ.</small></div></header>
<section class="mode" role="group" aria-label="Chọn chế độ ghi âm"><button type="button" id="modeNormal" aria-pressed="true"><b>🎙 Thu âm thường</b><small>Hiện chữ khi trò chuyện</small></button><button type="button" id="modeLecture" aria-pressed="false"><b>📖 Thu âm bài giảng</b><small>Hiện chữ khi thầy giảng</small></button></section>

<section class="panel" aria-label="Văn bản ghi chép">
<div class="panel-heading"><strong><span id="liveDot" class="live-dot" aria-hidden="true"></span><span id="liveLabel">Chữ được ghi lại</span></strong><div class="punc"><button type="button" id="btnPeriod">. Chấm</button><button type="button" id="btnComma">, Phẩy</button><button type="button" id="btnNewline">↵ Xuống Dòng</button></div></div>
<textarea id="resultText" class="editor" placeholder="Lời nói sẽ hiện thành chữ ở đây ngay khi bạn nói…" spellcheck="true" aria-label="Văn bản ghi chép"></textarea>
<div class="panel-foot"><span id="stats">0 từ · 0 ký tự</span><button type="button" id="btnSaveText" class="save-text" title="Tải văn bản về máy">↓ Lưu thành file</button><span class="level" title="Mức tiếng micro (không phải điểm chất lượng)"><span id="meter" style="display:block;height:100%;width:0;background:var(--green);border-radius:inherit"></span></span></div>
</section>
<button type="button" id="btnToggle" class="primary">● BẮT ĐẦU HIỆN CHỮ</button>
<div class="tools"><button id="btnCopy" class="small-btn blue">Sao chép</button><button id="btnDelete" class="small-btn">Xóa 1 từ</button><button id="btnUndo" class="small-btn" disabled>Khôi phục</button><button id="btnNew" class="small-btn danger">Xóa hết</button></div>
<section class="audio" id="audioPanel" aria-label="Bản ghi âm vừa thu">
  <div class="audio-bar">
    <strong class="audio-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg> Bản ghi</strong>
    <button type="button" id="audioPlay" class="audio-play" disabled aria-label="Phát bản ghi">▶</button>
    <input type="range" id="audioSeek" class="audio-seek" min="0" max="1000" value="0" disabled aria-label="Vị trí phát bản ghi" />
    <span class="audio-time" id="audioTime">00:00</span>
    <button type="button" id="audioMute" class="audio-mute" disabled aria-label="Tắt âm lượng">◖))</button>
    <a id="btnDownloadAudio" class="audio-link" aria-disabled="true" tabindex="-1">↓ Tải về</a>
    <button type="button" id="btnDeleteAudio" class="audio-remove" disabled>Xóa</button>
  </div>
  <audio id="audioPlayer" preload="metadata" hidden></audio>
  <p id="audioMessage" class="audio-message" hidden></p>
</section>

</main><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const el={box:$('resultText'),banner:$('statusBanner'),title:$('statusTitle'),sub:$('statusSub'),timer:$('timer'),meter:$('meter'),toggle:$('btnToggle'),panel:$('audioPanel'),player:$('audioPlayer'),download:$('btnDownloadAudio'),deleteAudio:$('btnDeleteAudio'),audioMessage:$('audioMessage'),stats:$('stats'),toast:$('toast'),undo:$('btnUndo')};
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let mode='normal';
let audioCaptureFailure='',audioEverStarted=false;
let recording=false,starting=false,stream=null,recorder=null,parts=[],audioUrl=null,startedAt=0,clock=null,audioCtx=null,analyser=null,meterTimer=null,sourceNode=null,recognition=null,recognitionRunning=false,recognitionWanted=false,restartTimer=null,recSeq=0,recText='',draftBase='',pendingFinal='',undo=[],lastError='',editorSize=23,stopRequested=false,textOnlyFallback=false,audioRequested=false;
const storeKey='soTayVoiceVietnamese_v4';
function toast(message){el.toast.textContent=message;el.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.toast.classList.remove('show'),2400)}
function status(title,subtitle,kind=''){el.title.textContent=title;el.sub.textContent=subtitle;el.banner.className='header-status'+(kind?' '+kind:'');document.getElementById('liveLabel').textContent=kind==='rec'&&recognitionWanted?'Đang hiện chữ trực tiếp…':(recording?'Đang chờ nhận chữ':'Chữ được ghi lại');document.getElementById('liveDot').classList.toggle('on',kind==='rec'&&recognitionWanted)}
function stats(){const v=el.box.value;el.stats.textContent=`${v.trim()?v.trim().split(/\s+/u).length:0} từ · ${v.length} ký tự`}
function save(){try{localStorage.setItem(storeKey,el.box.value)}catch(e){}stats()}
function pushUndo(){undo.push(el.box.value);if(undo.length>30)undo.shift();el.undo.disabled=false}
function setText(t){el.box.value=t;draftBase=t;save();el.box.scrollTop=el.box.scrollHeight}
function capitalize(t){return t.replace(/(^|[.!?][ \t\n]*|\n[ \t]*)(\p{Ll})/gu,(all,pre,char)=>pre+char.toUpperCase())}
function normalize(t){return t.replace(/[ \t]+([.,!?])/g,'$1').replace(/([.,!?])([^\s\n.,!?])/g,'$1 $2').replace(/[ \t]{2,}/g,' ')}
function joinText(base,addition){
  let b=base||'',a=addition||'';
  if(!a.trim()&&!a.includes('\n'))return b;
  if(/^\s*[.,]/.test(a)){b=b.replace(/[ \t.,]+$/,'');return b+a.trimStart()}
  if(/^\s*\n/.test(a))return b.replace(/[ \t]+$/,'')+a.trimStart();
  if(!a.trim())return b;
  return b+(b&&!/[\s\n]$/.test(b)?' ':'')+a.trim();
}
// Các lệnh được đọc thành tiếng: chấm, phẩy, xuống dòng (hoặc xuống hàng).
function spoken(t){
  let s=(t||'').normalize('NFC').trim();
  // Bỏ dấu tự thêm quanh các từ lệnh, nhưng không xóa dấu ở các câu khác.
  s=s.replace(/(?<![\p{L}\p{N}])(?:dấu\s+)?chấm\s+xuống\s+(?:dòng|hàng)(?![\p{L}\p{N}])/giu,'.\n');
  s=s.replace(/(?<![\p{L}\p{N}])(?:dấu\s+)?phẩy\s+xuống\s+(?:dòng|hàng)(?![\p{L}\p{N}])/giu,',\n');
  s=s.replace(/(?<![\p{L}\p{N}])(?:dấu\s+)?chấm(?![\p{L}\p{N}])/giu,'.');
  s=s.replace(/(?<![\p{L}\p{N}])(?:dấu\s+)?phẩy(?![\p{L}\p{N}])/giu,',');
  s=s.replace(/(?<![\p{L}\p{N}])xuống\s+(?:dòng|hàng)(?![\p{L}\p{N}])/giu,'\n');
  return normalize(s).replace(/[ \t]*\n[ \t]*/g,'\n');
}
function commitLive(){if(pendingFinal.trim()){draftBase=capitalize(normalize(joinText(draftBase,spoken(pendingFinal))));pendingFinal='';setText(draftBase)}else{el.box.value=draftBase;save()}}
function renderLive(interim=''){const confirmed=joinText(draftBase,spoken(pendingFinal));const full=joinText(confirmed,spoken(interim));el.box.value=capitalize(normalize(full));stats();el.box.scrollTop=el.box.scrollHeight}
function stopASR(){recognitionWanted=false;clearTimeout(restartTimer);const s=recognition;recognition=null;recSeq++;recognitionRunning=false;if(s){try{s.stop()}catch(e){}}}
function scheduleASR(delay=350){if(!recognitionWanted||!recording)return;clearTimeout(restartTimer);restartTimer=setTimeout(()=>{if(recording&&recognitionWanted&&!recognitionRunning)launchASR()},delay)}
function launchASR(){
 if(!SpeechRecognition || !recording || !recognitionWanted || recognitionRunning)return;
 const seq=++recSeq, s=new SpeechRecognition(); recognition=s;
 s.lang='vi-VN';
 // Chế độ ngắn, tự nối lượt: phù hợp Web Speech API trên điện thoại hơn continuous=true.
 s.continuous=false;
 s.interimResults=true;
 s.maxAlternatives=1;
 let finalText='', interimText='', sessionError='', started=false;
 // Đặt trạng thái khởi động ngay để không tạo hai phiên đồng thời.
 recognitionRunning=true;
 s.onstart=()=>{
  if(seq!==recSeq)return;
  started=true;
  status(mode==='lecture'?'Đang nghe bài giảng':'Đang nghe nói',
    'Đang chuyển lời nói thành chữ…','rec');
 };
 s.onresult=e=>{
  if(seq!==recSeq)return;
  finalText='';interimText='';
  // Kết quả tạm có thể bị trình duyệt sửa; luôn dựng lại toàn bộ mỗi lần.
  for(let i=0;i<e.results.length;i++){
   const r=e.results[i]; const v=(r[0]?.transcript||'').trim();
   if(!v)continue;
   if(r.isFinal)finalText=joinText(finalText,v);
   else interimText=joinText(interimText,v);
  }
  pendingFinal=finalText;
  renderLive(interimText);
 };
 s.onerror=e=>{
  if(seq!==recSeq)return;
  sessionError=e.error;
  if(e.error==='audio-capture' && !textOnlyFallback && stream){
   // Trên vài điện thoại MediaRecorder chiếm micro, khiến SpeechRecognition không nghe được.
   // Ưu tiên hiện chữ: giải phóng luồng ghi âm và thử lại nhận dạng một lần.
   textOnlyFallback=true;
   try{recorder?.requestData()}catch(_){}
   try{if(recorder?.state!=='inactive')recorder.stop()}catch(_){}
   stream.getTracks().forEach(t=>t.stop()); stream=null;clearMeter();
   status('ƯU TIÊN HIỆN CHỮ','Micro không hỗ trợ ghi âm song song. Đang chuyển sang chỉ lấy chữ.','rec');
   return;
  }
  if(['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'].includes(e.error)){
   recording=false;clearInterval(clock);el.toggle.classList.remove('active');el.toggle.textContent='● BẮT ĐẦU HIỆN CHỮ';
   try{if(recorder?.state==='recording')recorder.stop()}catch(_){}
   stream?.getTracks().forEach(t=>t.stop());stream=null;clearMeter();
   recognitionWanted=false;
   status('KHÔNG NHẬN ĐƯỢC CHỮ','Lỗi '+e.error+'. Hãy kiểm tra quyền micro / kết nối.','error');
  }
 };
 s.onend=()=>{
  if(seq!==recSeq)return;
  recognitionRunning=false;recognition=null;
  // Ghi lại chữ đã được nhận chắc chắn trước khi khởi động lượt nghe tiếp.
  if(finalText.trim()){
   draftBase=capitalize(normalize(joinText(draftBase,spoken(finalText))));
   pendingFinal='';setText(draftBase);
  }else{
   pendingFinal='';el.box.value=draftBase;save();
  }
  if(recording&&recognitionWanted){
   status(mode==='lecture'?'Đang nghe bài giảng':'Đang nghe nói',
     'Đang nối lượt nghe…','rec');
   scheduleASR(sessionError==='no-speech'?350:180);
  }
 };
 try{s.start()}catch(e){
  recognitionRunning=false;
  if(seq===recSeq){recognition=null;scheduleASR(900)}
 }
}
function restartASRAfterEdit(){if(!recording||!recognitionWanted)return;stopASR();pendingFinal='';draftBase=el.box.value;recognitionWanted=true;scheduleASR(260)}
function setupMeter(mic){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=new AC();analyser=audioCtx.createAnalyser();analyser.fftSize=1024;sourceNode=audioCtx.createMediaStreamSource(mic);sourceNode.connect(analyser);const buff=new Uint8Array(analyser.fftSize);meterTimer=setInterval(()=>{if(!analyser)return;analyser.getByteTimeDomainData(buff);let sq=0;for(let i=0;i<buff.length;i++){const v=(buff[i]-128)/128;sq+=v*v}const rms=Math.sqrt(sq/buff.length);el.meter.style.width=Math.min(100,Math.round(rms*320))+'%'},130)}catch(e){}}
function clearMeter(){clearInterval(meterTimer);meterTimer=null;el.meter.style.width='0%';try{sourceNode?.disconnect()}catch(e){}sourceNode=null;analyser=null;audioCtx?.close().catch(()=>{});audioCtx=null}
function tick(){const secs=Math.floor((Date.now()-startedAt)/1000);el.timer.textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function mimeType(){const types=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'];return types.find(t=>MediaRecorder.isTypeSupported(t))||''}
function filename(ext){const date=new Date();const p=n=>String(n).padStart(2,'0');return `Bai-giang_${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}_${p(date.getHours())}-${p(date.getMinutes())}.${ext}`}
const playback={play:$('audioPlay'),seek:$('audioSeek'),time:$('audioTime'),mute:$('audioMute')};
function formatAudioTime(t){const n=Number.isFinite(t)?Math.max(0,Math.floor(t)):0;return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function updateAudioControls(){
 const available=!!audioUrl;
 playback.play.disabled=!available;playback.seek.disabled=!available;playback.mute.disabled=!available;
 el.deleteAudio.disabled=!available;
 el.download.setAttribute('aria-disabled',String(!available));
 if(available)el.download.removeAttribute('tabindex');else el.download.setAttribute('tabindex','-1');
 playback.play.textContent=el.player.paused?'▶':'Ⅱ';
 playback.play.setAttribute('aria-label',el.player.paused?'Phát bản ghi':'Tạm dừng');
 playback.mute.textContent=el.player.muted?'◖':'◖))';
 const duration=Number.isFinite(el.player.duration)?el.player.duration:0;
 playback.seek.value=duration?Math.round((el.player.currentTime/duration)*1000):0;
 playback.time.textContent=formatAudioTime(el.player.currentTime || 0);
}
function clearAudio(notify=false){
 el.player.pause();el.player.removeAttribute('src');el.player.load();
 el.download.removeAttribute('href');el.download.removeAttribute('download');
 el.audioMessage.hidden=true;el.audioMessage.textContent='';
 if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null;}
 updateAudioControls();
 if(notify)toast('Đã xóa bản ghi âm trên trang.');
}
function showAudioError(message){
 if(audioUrl)return;
 el.audioMessage.hidden=false;el.audioMessage.textContent=message;
 updateAudioControls();
}
function showAudio(blob){
 if(!blob.size)return;
 clearAudio();
 audioUrl=URL.createObjectURL(blob);
 el.player.src=audioUrl;
 const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';
 el.download.href=audioUrl;
 el.download.download=filename(ext);
 el.audioMessage.hidden=true;
 updateAudioControls();
 toast('Đã lưu bản ghi. Bạn có thể nghe, tải hoặc xóa.');
}
playback.play.onclick=async()=>{if(!audioUrl)return;if(el.player.paused){try{await el.player.play()}catch(e){toast('Không phát được file ghi âm trên thiết bị này.')}}else el.player.pause();updateAudioControls()};
playback.seek.oninput=()=>{if(!audioUrl||!Number.isFinite(el.player.duration)||!el.player.duration)return;el.player.currentTime=(Number(playback.seek.value)/1000)*el.player.duration;updateAudioControls()};
playback.mute.onclick=()=>{if(!audioUrl)return;el.player.muted=!el.player.muted;updateAudioControls()};
['play','pause','timeupdate','durationchange','loadedmetadata','ended'].forEach(name=>el.player.addEventListener(name,updateAudioControls));
el.download.addEventListener('click',e=>{if(!audioUrl)e.preventDefault()});
el.deleteAudio.addEventListener('click',()=>{
 if(!audioUrl)return;
 if(!confirm('Xóa bản ghi âm này khỏi trang? Nếu chưa tải về, bạn sẽ không nghe lại được.'))return;
 clearAudio(true);
});
updateAudioControls();
async function startAudioCapture(){
 const audioSession=startedAt;
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){audioCaptureFailure='Trình duyệt không hỗ trợ ghi file âm thanh. Chữ vẫn được lưu bình thường.';return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  if(!recording || audioSession!==startedAt){stream.getTracks().forEach(t=>t.stop());stream=null;return}
  const type=mimeType();const thisRecorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);
  recorder=thisRecorder;
  thisRecorder.ondataavailable=e=>{if(e.data?.size)parts.push(e.data)};
  thisRecorder.onstop=()=>{const blob=new Blob(parts,{type:thisRecorder.mimeType||'audio/webm'});if(blob.size)showAudio(blob);else if(!recording)showAudioError('Không có dữ liệu âm thanh để nghe lại. Phần chữ vẫn được lưu.');parts=[];stream?.getTracks().forEach(t=>t.stop());stream=null};
  thisRecorder.onerror=()=>{audioCaptureFailure='Đã có lỗi khi ghi âm. Phần chữ vẫn được giữ.';toast('Không lưu được âm thanh. Phần nhận chữ vẫn hoạt động.')};
  thisRecorder.start(1000);audioEverStarted=true;setupMeter(stream);
 }catch(e){toast('Không mở được ghi âm phụ. Phần hiện chữ vẫn tiếp tục.');audioRequested=false;audioCaptureFailure='Không thể mở micro để lưu âm thanh. Phần chữ vẫn hoạt động.';}
}
async function begin(){
 if(recording||starting)return;
 if(!SpeechRecognition){status('KHÔNG HỖ TRỢ NHẬN CHỮ','Hãy mở bằng trình duyệt có hỗ trợ nhận dạng giọng nói.','error');return}
 if(!window.isSecureContext){status('CẦN HTTPS','Hãy mở website qua HTTPS để sử dụng micro.','error');return}
 if(audioUrl && !confirm('Bản ghi âm cũ sẽ bị thay thế. Bạn đã tải về máy chưa?'))return;
 starting=true;el.toggle.disabled=true;
 try{
  if(audioUrl)clearAudio()
  parts=[];audioCaptureFailure='';audioEverStarted=false;stopRequested=false;textOnlyFallback=false;audioRequested=true;
  recording=true;startedAt=Date.now();el.timer.textContent='00:00';clock=setInterval(tick,1000);
  el.toggle.classList.add('active');el.toggle.textContent='■ DỪNG & LƯU CHỮ';
  draftBase=el.box.value;pendingFinal='';recognitionWanted=true;
  // Ưu tiên Web Speech như bản tham chiếu: khởi động nhận chữ trước và không bắt buộc MediaRecorder.
  launchASR();status('ĐANG NHẬN CHỮ','Đang mở micro nhận giọng nói…','rec');
  startAudioCapture();
  try{window.currentWakeLock=await navigator.wakeLock?.request('screen')||null}catch(e){}
 }finally{starting=false;el.toggle.disabled=false}
}
function finish(){if(!recording||stopRequested)return;stopRequested=true;commitLive();recording=false;recognitionWanted=false;clearTimeout(restartTimer);const lastRecognition=recognition;recognition=null;recSeq++;recognitionRunning=false;try{lastRecognition?.stop()}catch(e){}clearTimeout(restartTimer);clearInterval(clock);tick();el.toggle.textContent='● BẮT ĐẦU HIỆN CHỮ';el.toggle.classList.remove('active');clearMeter();try{recorder?.requestData()}catch(e){}try{if(recorder?.state!=='inactive')recorder.stop()}catch(e){}if(recorder?.state==='inactive'){stream?.getTracks().forEach(t=>t.stop());stream=null;}if(!audioEverStarted||audioCaptureFailure)showAudioError(audioCaptureFailure||'Thiết bị không tạo được bản ghi âm. Chữ vẫn được lưu.');try{window.currentWakeLock?.release()}catch(e){}window.currentWakeLock=null;status('ĐÃ DỪNG','Đã lưu chữ. Bản ghi âm sẽ hiện bên dưới khi xử lý xong.');save()}
function selectMode(next){
 if(recording||starting){toast('Dừng ghi trước khi đổi chế độ.');return}
 mode=next;
 $('modeNormal').setAttribute('aria-pressed',String(mode==='normal'));
 $('modeLecture').setAttribute('aria-pressed',String(mode==='lecture'));
 el.box.placeholder=mode==='lecture'?'Để gần giáo viên sẽ thu âm tốt hơn…':'Bạn nói đến đâu, chữ sẽ hiện đến đó…';
 status('Sẵn sàng',mode==='lecture'?'Bấm BẮT ĐẦU để ghi lời giảng thành chữ':'Bấm BẮT ĐẦU để ghi lời nói thành chữ');
}
$('modeNormal').onclick=()=>selectMode('normal');
$('modeLecture').onclick=()=>selectMode('lecture');
el.toggle.onclick=()=>recording?finish():begin();
function punct(sym){pushUndo();const raw=el.box.value;let next=raw;if(sym==='\n'){next=raw.replace(/[ \t]+$/,'')+'\n'}else{next=raw.replace(/[ \t.,]+$/,'')+sym+' '}setText(capitalize(next));restartASRAfterEdit()}
$('btnPeriod').onclick=()=>punct('.');$('btnComma').onclick=()=>punct(',');$('btnNewline').onclick=()=>punct('\n');
el.box.addEventListener('input',()=>{draftBase=el.box.value;save();restartASRAfterEdit()});
$('btnDelete').onclick=()=>{if(!el.box.value)return;pushUndo();const t=el.box.value.trimEnd();setText(t.replace(/(?:^|\s)\S+$/u,''));restartASRAfterEdit()};
el.undo.onclick=()=>{if(!undo.length)return;setText(undo.pop());el.undo.disabled=!undo.length;restartASRAfterEdit()};
$('btnNew').onclick=()=>{if(!el.box.value.trim())return;if(!confirm('Xóa toàn bộ chữ? Bản ghi âm đang thu không bị xóa.'))return;pushUndo();setText('');restartASRAfterEdit()};
$('btnSaveText').onclick=()=>{const content=el.box.value.trim();if(!content){toast('Chưa có chữ để lưu.');return}const blob=new Blob(['\uFEFF'+content],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename('txt');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Đã tạo file chữ. Hãy lưu vào máy.')};
$('btnCopy').onclick=async()=>{if(!el.box.value.trim()){toast('Chưa có chữ để sao chép.');return}try{await navigator.clipboard.writeText(el.box.value);toast('Đã sao chép toàn bộ chữ.')}catch(e){el.box.focus();el.box.select();try{document.execCommand('copy');toast('Đã sao chép chữ.')}catch(_){toast('Không sao chép được. Hãy chọn và sao chép thủ công.')}}};
window.addEventListener('beforeunload',e=>{if(recording){e.preventDefault();e.returnValue='Bạn đang ghi âm. Nếu thoát, bản ghi có thể bị mất.'}});
try{const prior=localStorage.getItem(storeKey);if(prior){el.box.value=prior;draftBase=prior;status('Đã mở sổ tay','Bản chữ lần trước được khôi phục. Bản ghi âm cần tải riêng.')}}catch(e){}stats();
</script>
